<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Social Buzz Radar</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">note / X / Instagram</p>
        <h1>Social Buzz Radar</h1>
      </div>
      <div class="topbar-actions">
        <button id="algorithmBtn" class="ghost-btn" type="button">📊 アルゴリズム情報</button>
        <div class="status" id="status">待機中</div>
      </div>
    </header>

    <div id="algorithmModal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel" role="dialog" aria-labelledby="algorithmModalTitle">
        <div class="modal-head">
          <div>
            <h2 id="algorithmModalTitle">SNSアルゴリズム情報</h2>
            <p class="modal-sub" id="algorithmModalSub">最終確認: -</p>
          </div>
          <div class="modal-actions">
            <button id="algorithmRefreshBtn" class="ghost-btn" type="button">今すぐ再確認</button>
            <button class="ghost-btn" type="button" data-close>閉じる</button>
          </div>
        </div>
        <div class="modal-tabs" id="algorithmTabs">
          <button class="tab-btn active" data-tab="changes" type="button">📈 直近の変化</button>
          <button class="tab-btn" data-tab="x" type="button">X</button>
          <button class="tab-btn" data-tab="instagram" type="button">Instagram</button>
          <button class="tab-btn" data-tab="tiktok" type="button">TikTok</button>
          <button class="tab-btn" data-tab="note" type="button">note</button>
        </div>
        <div class="modal-body" id="algorithmBody">読み込み中...</div>
      </div>
    </div>

    <main class="layout">
      <section class="control-panel" aria-label="分析条件">
        <label>
          あなたの発信ジャンル
          <span class="field-hint">あなたが発信している領域。<strong>関係ない話題を除外</strong>するフィルターと、Claudeが書く<strong>文章の専門性</strong>に反映されます。<br>例: 「AIアバター、SNSマーケティング」</span>
          <input id="niche" value="AIアバター、SNSマーケティング、クリエイター支援">
        </label>
        <label>
          届けたい相手（読者）
          <span class="field-hint">想定する読み手。Claude生成時の<strong>説明レベル・選ぶ言葉・切り口</strong>が変わります。<br>例: 「経営者」なら経営判断目線、「クリエイター」なら制作現場目線</span>
          <input id="audience" value="経営者、マーケ担当、クリエイター">
        </label>
        <label>
          投稿のトーン・スタンス
          <span class="field-hint">どんな姿勢で発信するか。文章の<strong>語気・トーン・方向性</strong>に反映されます。<br>例: 「公式情報を根拠に、煽らない」「率直に、現場視点で」</span>
          <textarea id="brandStance" rows="2">公式情報を根拠に、実務で使える形まで落とし込む</textarea>
        </label>
        <label>
          含めたいキーワード（任意）
          <span class="field-hint">この語を含む話題だけに絞り込みます。空欄なら絞り込みなし。<br>例: 「生成AI 法務 採用」</span>
          <input id="query" placeholder="例: 生成AI 法務 採用">
        </label>

        <fieldset>
          <legend>投稿面（生成対象）</legend>
          <span class="field-hint">チェックした媒体だけ表示・生成されます。</span>
          <label class="check"><input type="checkbox" value="note" checked> note</label>
          <label class="check"><input type="checkbox" value="x" checked> X</label>
          <label class="check"><input type="checkbox" value="instagram" checked> Instagram</label>
          <label class="check"><input type="checkbox" value="tiktok" checked> TikTok</label>
        </fieldset>

        <fieldset>
          <legend>絞り込みオプション</legend>
          <label class="check"><input type="checkbox" id="nicheFilter" checked> 領域フィルターを使う</label>
          <span class="field-hint">ONにすると、「あなたの発信ジャンル」と一切関係ない話題（例: スポーツニュース、芸能ニュース）が結果から除外されます。</span>
        </fieldset>

        <label>
          自分で追加したい話題（任意）
          <span class="field-hint">気になる話題を自分で書き加える欄。1行1トピック。ここに入れた話題は<strong>必ず結果の最上位に表示</strong>されます。</span>
          <textarea id="manualTrends" rows="6" placeholder="例: OpenAI上場&#10;Apple Intelligence発表"></textarea>
        </label>

        <div class="actions">
          <button id="analyzeBtn">分析</button>
          <button id="variationBtn" class="secondary" disabled title="先に「分析」を押してください">文章バリエーション生成</button>
        </div>
      </section>

      <section class="workspace" aria-label="分析結果">
        <div class="auto-refresh-bar">
          <label class="check">
            <input type="checkbox" id="autoRefreshToggle"> 自動更新
          </label>
          <select id="refreshInterval">
            <option value="5" selected>5分ごと</option>
            <option value="10">10分ごと</option>
            <option value="15">15分ごと</option>
            <option value="30">30分ごと</option>
          </select>
          <span id="countdown" class="countdown">停止中</span>
        </div>

        <div class="summary-strip">
          <div>
            <span class="label">候補</span>
            <strong id="trendCount">0</strong>
          </div>
          <div>
            <span class="label">最高スコア</span>
            <strong id="topScore">0</strong>
          </div>
          <div>
            <span class="label">更新</span>
            <strong id="generatedAt">-</strong>
          </div>
        </div>

        <div class="canvas-band">
          <canvas id="scoreCanvas" width="880" height="240"></canvas>
        </div>

        <div id="results" class="results"></div>
      </section>
    </main>

    <template id="resultTemplate">
      <article class="topic-card">
        <div class="topic-head">
          <div>
            <p class="rank"></p>
            <h2></h2>
            <p class="published-info"></p>
          </div>
          <div class="score-pill"></div>
        </div>
        <div class="score-grid"></div>
        <div class="source-line"></div>
        <div class="card-cta">
          <button class="claude-gen-btn" type="button">✨ この話題でClaude生成</button>
          <span class="cta-hint">下のテンプレ案ではなく、Claudeが本物の創作で書きます（約50秒）</span>
        </div>
        <div class="claude-result"></div>
        <details class="template-plans">
          <summary>📝 テンプレ案（参考用・キーワード差し込みのみ）</summary>
          <div class="plan-grid"></div>
        </details>
        <details>
          <summary>検証と安全確認</summary>
          <ul class="checklist"></ul>
        </details>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
